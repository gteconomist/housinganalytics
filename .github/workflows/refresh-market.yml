name: Refresh market overlay (ZORI + Redfin)
on:
  schedule:
    - cron: '0 9 20 * *'   # 20th of each month, after Zillow's mid-month ZORI release
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-market
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ZORI + Redfin
        run: node scripts/fetch-market.mjs
      - name: Refresh market overlay in bundles
        run: node scripts/refresh-market.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/analysis-data
          if git diff --staged --quiet; then
            echo "No market changes this month."
          else
            git commit -m "Auto-refresh market overlay $(date -u +%Y-%m)"
            git push
          fi
