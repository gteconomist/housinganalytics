name: Deploy housinganalytics.org

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        env:
          # GitHub-hosted Linux runners have 16 GB RAM. The astro build over
          # 3,222 county pages + ~4,800 place pages with QCEW + OEWS payloads
          # needs 13-14 GB at peak. 14 GB leaves ~2 GB for the OS and child
          # processes, which is the practical ceiling on these runners.
          # package.json's build script reads NODE_HEAP_MB (defaults to 8192
          # for local Mac builds with 32 GB RAM); CI overrides it here.
          NODE_HEAP_MB: 14336
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
