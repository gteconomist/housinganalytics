name: Deploy housinganalytics.org

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        env:
          # GitHub runners have 7 GB RAM. Default Node heap is too small for
          # the astro build over 3,222 county pages with QCEW + OEWS payloads.
          NODE_OPTIONS: --max-old-space-size=6144
          # Census API key for the place-level fetch step (fetch-acs-places.mjs).
          # Configure as a repository secret at:
          #   github.com/gteconomist/housinganalytics/settings/secrets/actions
          # If the secret is missing the places step still runs but rate-limits
          # may kick in at higher state counts.
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          # 2-digit state FIPS, or 'all'. Default '13' = Georgia pilot.
          CENSUS_STATE: ${{ vars.CENSUS_STATE || '13' }}
          # Population threshold for place inclusion (default 10000).
          PLACE_MIN_POP: ${{ vars.PLACE_MIN_POP || '10000' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
